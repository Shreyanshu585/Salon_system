server:
  port: 8070

spring:
  application:
    name: Eureka-service

eureka:
  instance:
    hostname: ${RENDER_EXTERNAL_HOSTNAME:localhost}

  client:
    register-with-eureka: false
    fetch-registry: false

    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
